<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">

  <!-- 让网页手机上显示 -->
  <meta name="viewport" content="width=device-width, initial-scale=1">

 <title>我的个人网站</title>

  <style>
    /* 页面整体样式 */
    body {
      max-width: 760px;
      margin: 100px auto;
      padding: 20px;
      font-family: system-ui;
    }

    /* 首页介绍区域 */
    .hero {
      padding: 48px 0;
    }

    .hero_label {
      margin: 0 0 12px;
      color: #1677ff;
      font-weight: 600;
    }

    .hero h1 {
      margin: 0;
      font-size: clamp(36px, 7vw, 64px);
      line-height: 1.1;
    }

    .hero_description {
      max-width: 560px;
      margin: 20px 0 28px;
      color: #4b5563;
      font-size: 18px;
      line-height: 1.8;
    }

    .hero_actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .primary_link,
    .secondary_link {
      display: inline-block;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 600;
      text-decoration: none;
    }

    .primary_link {
      color: white;
      background: #1677ff;
    }

    .primary_link:hover {
      background: #0958d9;
    }

    .secondary_link {
      color: #1677ff;
      border: 1px solid #a8c7fa;
    }

    .secondary_link:hover {
      background: #f0f6ff;
    }

    .site_nav {
      display: flex;
      gap: 20px;
      margin-bottom: 40px;
    }

    .site_nav a {
      color: #1677ff;
      text-decoration: none;
    }

    .site_nav a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <nav class="site_nav" aria-label="主导航">
    <a href="./">首页</a>
    <a href="./guides/">技术文章</a>
  </nav>
  <main>
   <section class="hero">
    <p class="hero_label">个人网站</p>

    <h1>你好，我是kingo</h1>

    <p class="hero_description">
      这里记录我的项目、技术笔记和学习过程。
    </p>

    <div class="hero_actions">
      <a class="primary_link" href="./guides/">阅读技术文章</a>

      <a
        class="secondary_link"
        href="https://github.com/kingo0807"
        target="_blank"
        rel="noopener noreferrer"
      >
        查看 GitHub
      </a>
    </div>
   </section>
  </main>
</body>
</html>
