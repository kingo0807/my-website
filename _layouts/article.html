---
---
<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | escape }} · {{ site.title | escape }}</title>

  {% assign meta_description = page.description | default: site.description %}
  <meta name="description" content="{{ meta_description | escape }}">

  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="stylesheet"
        href="{{ '/assets/css/article.css' | relative_url }}">

  <meta property="og:type" content="article">
  <meta property="og:site_name" content="{{ site.title | escape }}">
  <meta property="og:title" content="{{ page.title | escape }}">
  <meta property="og:description" content="{{ meta_description | escape }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ '/chat/icon-512.png' | absolute_url }}">
  <meta property="og:image:width" content="512">
  <meta property="og:image:height" content="512">
  <meta name="twitter:card" content="summary">
</head>
<body>
  <header class="site-header">
    <a href="{{ '/' | relative_url }}">首页</a>
    <a href="{{ '/guides/' | relative_url }}">文章目录</a>
  </header>

  <main class="article">
    {{ content }}
  </main>
</body>
</html>
