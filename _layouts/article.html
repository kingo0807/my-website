---
---
<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | escape }} · {{ site.title | escape }}</title>

  {% assign meta_description = page.description | default: site.description %}
  <meta name="description" content="{{ meta_description | escape }}">

  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="stylesheet"
        href="{{ '/assets/css/article.css' | relative_url }}">

  <meta property="og:type" content="article">
  <meta property="og:site_name" content="{{ site.title | escape }}">
  <meta property="og:title" content="{{ page.title | escape }}">
  <meta property="og:description" content="{{ meta_description | escape }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ '/assets/og-image.png' | absolute_url }}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="kingo 的个人网站：项目、技术笔记与学习过程">
  <meta name="twitter:card" content="summary_large_image">
</head>
<body>
  <div class="read-progress" id="read-progress" aria-hidden="true"></div>

  <header class="site-header">
    <a href="{{ '/' | relative_url }}">首页</a>
    <a href="{{ '/guides/' | relative_url }}">文章目录</a>
    <a href="{{ '/updates/' | relative_url }}">更新记录</a>
    <button type="button" class="theme-toggle" id="theme-toggle" aria-pressed="false">深色</button>
  </header>

  <div class="article-layout">
    <main class="article">
      {{ content }}
    </main>
    <nav class="toc" id="toc" aria-label="本页目录"></nav>
  </div>

  <button type="button" class="to-top" id="to-top" aria-label="回到顶部" hidden>↑</button>

  <script src="{{ '/assets/js/article.js' | relative_url }}" defer></script>
</body>
</html>
