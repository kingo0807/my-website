name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 站点级检查：模板 Liquid、指南 front matter、站内链接
      - name: 站点结构与链接检查
        run: node _tools/check.mjs
